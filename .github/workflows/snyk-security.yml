# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# A sample workflow which sets up Snyk to analyze the full Snyk platform (Snyk Open Source, Snyk Code,
# Snyk Container and Snyk Infrastructure as Code)
# The setup installs the Snyk CLI - for more details on the possible commands
# check https://docs.snyk.io/snyk-cli/cli-reference
# The results of Snyk Code are then uploaded to GitHub Security Code Scanning
#
# In order to use the Snyk Action you will need to have a Snyk API token.
# More details in https://github.com/snyk/actions#getting-your-snyk-token
# or you can signup for free at https://snyk.io/login
#
# For more examples, including how to limit scans to only high-severity issues
# and fail PR checks, see https://github.com/snyk/actions/

name: Snyk Security

on:
  push:
    branches: ["main" ]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  # Pull requests from Dependabot and from forks get no Actions secrets, so
  # SNYK_TOKEN is empty there and every Snyk command fails with 401 (SNYK-0005).
  # Skip the scan on those pull requests; anywhere else a missing token is a
  # configuration error. To scan Dependabot PRs too, add SNYK_TOKEN as a
  # Dependabot secret: gh secret set SNYK_TOKEN --app dependabot
  token:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - name: Check for SNYK_TOKEN
        id: check
        env:
          HAS_TOKEN: ${{ secrets.SNYK_TOKEN != '' }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$HAS_TOKEN" = true ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = pull_request ]; then
            echo "::notice::SNYK_TOKEN is not available to this pull request (Dependabot or fork); skipping Snyk."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Set the SNYK_TOKEN secret (Snyk API token)"
            exit 1
          fi

  snyk:
    needs: token
    if: needs.token.outputs.available == 'true'
    permissions:
      contents: read
      security-events: write
      actions: read
    runs-on: ubuntu-latest

    # Move the environment variable here so ALL steps can see it
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Snyk CLI to check for security issues
        uses: snyk/actions/setup@11b673cfb4b0dc0d860a1323caa199d54950dcce
        # (Removed the local env block from here)

      - name: Snyk Code test
        run: snyk code test --sarif > snyk-code.sarif

      # Snyk resolves a pip requirements.txt from the installed packages, not
      # its pins ("Missing required packages" otherwise). Install Certbot's
      # hash-locked requirements into a venv, as Dockerfile.certbot does, and
      # point Snyk at that venv.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install Certbot's locked requirements
        run: |
          python -m venv .snyk-venv
          .snyk-venv/bin/pip install --require-hashes --only-binary=:all: --no-deps -r certbot/requirements.txt
          .snyk-venv/bin/pip check

      - name: Snyk Open Source monitor
        run: |
          export VIRTUAL_ENV="$PWD/.snyk-venv" PATH="$PWD/.snyk-venv/bin:$PATH"
          snyk monitor --file=certbot/requirements.txt --package-manager=pip \
            --command="$VIRTUAL_ENV/bin/python"

      # Exit 3 means no IaC files were found (the repo has no Terraform,
      # Kubernetes or CloudFormation); treat that as nothing to scan.
      # - name: Snyk Infrastructure as Code (IaC) test and report
      #   run: |
      #     rc=0; snyk iac test --report || rc=$?
      #     [ "$rc" -eq 3 ] && { echo "No IaC files found; nothing to scan."; exit 0; }
      #     exit "$rc"

      - name: Build a Docker image
        run: docker build -t your/image-to-test .

      - name: Snyk Container monitor
        run: snyk container monitor your/image-to-test --file=Dockerfile

      - name: Upload result to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: snyk-code.sarif
