# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# A sample workflow which sets up Snyk to analyze the full Snyk platform (Snyk Open Source, Snyk Code,
# Snyk Container and Snyk Infrastructure as Code)
# The setup installs the Snyk CLI - for more details on the possible commands
# check https://docs.snyk.io/snyk-cli/cli-reference
# The results of Snyk Code are then uploaded to GitHub Security Code Scanning
#
# In order to use the Snyk Action you will need to have a Snyk API token.
# More details in https://github.com/snyk/actions#getting-your-snyk-token
# or you can signup for free at https://snyk.io/login
#
# For more examples, including how to limit scans to only high-severity issues
# and fail PR checks, see https://github.com/snyk/actions/

name: Snyk Security

on:
  push:
    branches: ["main", "CertBot"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  snyk:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    runs-on: ubuntu-latest
    env:
      # Job-level so every `snyk` command can authenticate. Set on the setup
      # step only, the CLI steps ran without it (401, SNYK-0005).
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Snyk CLI to check for security issues
        # Snyk can be used to break the build when it detects security issues.
        # In this case we want to upload the SAST issues to GitHub Code Scanning
        uses: snyk/actions/setup@11b673cfb4b0dc0d860a1323caa199d54950dcce

        # For Snyk Open Source you must first set up the development environment for your application's dependencies
        # For example for Node
        #- uses: actions/setup-node@v4
        #  with:
        #    node-version: 20

        # Runs Snyk Code (SAST) analysis and uploads result into GitHub.
        # Exit 1 means issues were found: they are reported through code
        # scanning (upload step below) instead of failing the job, so the
        # remaining Snyk steps still run. Errors (2) and no code (3) still fail.
      - name: Snyk Code test
        run: |
          rc=0; snyk code test --sarif-file-output=snyk-code.sarif || rc=$?
          [ "$rc" -le 1 ] || exit "$rc"

        # Snyk resolves a pip requirements.txt from the installed environment,
        # not from its pins. Without this, it reports the runner's system
        # Python packages instead of what the Certbot image ships. Install the
        # hash-locked requirements the same way Dockerfile.certbot does.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Certbot's locked requirements
        run: |
          python -m venv .snyk-venv
          .snyk-venv/bin/pip install --require-hashes --only-binary=:all: --no-deps -r certbot/requirements.txt
          .snyk-venv/bin/pip check

        # Snyk resolves a pip requirements.txt from the installed environment,
        # not from its pins. Without this, it reports the runner's system
        # Python packages instead of what the Certbot image ships. Install the
        # hash-locked requirements the same way Dockerfile.certbot does.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Certbot's locked requirements
        run: |
          python -m venv .snyk-venv
          .snyk-venv/bin/pip install --require-hashes --only-binary=:all: --no-deps -r certbot/requirements.txt
          .snyk-venv/bin/pip check

        # Runs Snyk Open Source (SCA) analysis and uploads result to Snyk.
      - name: Snyk Open Source monitor
        run: snyk monitor --all-projects --command=.snyk-venv/bin/python --exclude=.snyk-venv

        # Runs Snyk Infrastructure as Code (IaC) analysis and uploads result to Snyk.
        # Issues found (1) are reported to Snyk; no IaC files (3) is expected,
        # as the repo has no Terraform or Kubernetes manifests. Errors (2) fail.
      - name: Snyk IaC test and report
        run: |
          rc=0; snyk iac test --report || rc=$?
          case "$rc" in 0|1|3) ;; *) exit "$rc" ;; esac

        # Build the docker image for testing
      - name: Build a Docker image
        run: docker build -t your/image-to-test .
        # Runs Snyk Container (Container and SCA) analysis and uploads result to Snyk.
      - name: Snyk Container monitor
        run: snyk container monitor your/image-to-test --file=Dockerfile

        # Push the Snyk Code results into GitHub Code Scanning tab
      - name: Upload result to GitHub Code Scanning
        if: always() && hashFiles('snyk-code.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: snyk-code.sarif
