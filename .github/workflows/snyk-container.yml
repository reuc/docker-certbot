# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# A sample workflow which checks out the code, builds a container
# image using Docker and scans that image for vulnerabilities using
# Snyk. The results are then uploaded to GitHub Security Code Scanning
#
# For more examples, including how to limit scans to only high-severity
# issues, monitor images for newly disclosed vulnerabilities in Snyk and
# fail PR checks for new vulnerabilities, see https://github.com/snyk/actions/

name: Snyk Container

on:
  push:
    branches: [ "main", "CertBot" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "main" ]
  schedule:
    - cron: '37 19 * * 3'

permissions:
  contents: read

jobs:
  # Pull requests from Dependabot and from forks get no Actions secrets, so
  # SNYK_TOKEN is empty there and Snyk fails with 401 (SNYK-0005), leaving no
  # snyk.sarif to upload. Skip the scan on those pull requests; anywhere else a
  # missing token is a configuration error. To scan Dependabot PRs too, add
  # SNYK_TOKEN as a Dependabot secret: gh secret set SNYK_TOKEN --app dependabot
  token:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
    - name: Check for SNYK_TOKEN
      id: check
      env:
        HAS_TOKEN: ${{ secrets.SNYK_TOKEN != '' }}
        EVENT: ${{ github.event_name }}
      run: |
        if [ "$HAS_TOKEN" = true ]; then
          echo "available=true" >> "$GITHUB_OUTPUT"
        elif [ "$EVENT" = pull_request ]; then
          echo "::notice::SNYK_TOKEN is not available to this pull request (Dependabot or fork); skipping Snyk."
          echo "available=false" >> "$GITHUB_OUTPUT"
        else
          echo "::error::Set the SNYK_TOKEN secret (Snyk API token)"
          exit 1
        fi

  snyk:
    needs: token
    if: needs.token.outputs.available == 'true'
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    # Same build as build-and-scan (make sets the base image and build args).
    - name: Build the certproxy image
      run: make build-certproxy TAG=latest
    - name: Run Snyk to check Docker image for vulnerabilities
      # Snyk can be used to break the build when it detects vulnerabilities.
      # In this case we want to upload the issues to GitHub Code Scanning
      continue-on-error: true
      uses: snyk/actions/docker@11b673cfb4b0dc0d860a1323caa199d54950dcce
      env:
        # In order to use the Snyk Action you will need to have a Snyk API token.
        # More details in https://github.com/snyk/actions#getting-your-snyk-token
        # or you can signup for free at https://snyk.io/login
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        image: wolfi-certproxy:latest
        args: --file=Dockerfile.certproxy
    - name: Upload result to GitHub Code Scanning
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: snyk.sarif
