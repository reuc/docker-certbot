# Dependabot version updates. Security fixes for Wolfi packages come from the
# daily no-cache rebuilds (build-and-scan, publish-certproxy), not from here:
# the Dockerfiles track cgr.dev/chainguard/wolfi-base:latest on purpose.
version: 2
updates:
  # certproxy crates (Cargo.toml / Cargo.lock)
  - package-ecosystem: "cargo"
    directory: "/certproxy"
    schedule:
      interval: "weekly"
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]

  # Certbot and DNS plugins (pip-compile requirements.in -> hash-locked requirements.txt)
  - package-ecosystem: "pip"
    directory: "/certbot"
    schedule:
      interval: "weekly"

  # Actions used by .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  # Pinned Vault and Pebble images used by the end-to-end test
  - package-ecosystem: "docker-compose"
    directory: "/tests/e2e"
    schedule:
      interval: "weekly"
