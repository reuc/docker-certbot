[package]
name = "certproxy"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = "0.11.1"
anyhow = "1.0.104"
argon2 = "0.6.0"
askama = "0.16.1"
axum = { version = "0.8.9", features = ["form", "json", "query", "macros"] }
axum-server = { version = "0.8.0", features = ["tls-rustls-no-provider"] }
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
hex = "0.4.3"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider", "charset", "http2"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8.5"
rustls-pemfile = "2.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
subtle = "2.6.1"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "parsing", "macros"] }
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "process", "sync", "time", "signal", "fs", "io-util"] }
totp-rs = { version = "6.0.0", features = ["otpauth", "gen_secret"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.28.0", features = ["v4"] }
x509-parser = "0.18.1"

[dev-dependencies]
http-body-util = "0.1.5"
rcgen = "0.14.10"
tower = { version = "0.5.3", features = ["util"] }
